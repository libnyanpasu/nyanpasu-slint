[package]
name = 'nyanpasu-slint'
version = '0.1.0'
description = 'Slint components and platform helpers shared by Clash Nyanpasu and its installer'
repository = 'https://github.com/libnyanpasu/nyanpasu-slint'
edition = '2024'
license = 'GPL-3.0'
# Hands the `.slint` library's project file to dependents' build scripts as
# `DEP_NYANPASU_SLINT_PROJECT`.
links = 'nyanpasu_slint'

[features]
# A headless software-rendered platform for render tests.
testing = ['slint/renderer-software', 'slint/compat-1-2', 'dep:slint-build']

[dependencies]
# Slint's internal crates only stay compatible within a release, so every
# Slint crate here and in the applications is pinned to the same version.
slint = { version = '=1.19.0', default-features = false, features = ['std'] }
# Used directly rather than through slint's `backend-winit`: Slint's backend
# selector enables the backend's muda menu support, whose Objective-C classes
# clash with the muda Tauri links on macOS.
# Every application here renders in software on Windows and macOS.
i-slint-backend-winit = { version = '=1.19.0', default-features = false, features = [
  'renderer-software',
] }
# The version Slint resolves system fonts with.
fontique = '0.12'

# Both of the applications' Linux windows run on X11 and Wayland.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
i-slint-backend-winit = { version = '=1.19.0', default-features = false, features = [
  'x11',
  'wayland',
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = '0.61', features = ['Win32_UI_WindowsAndMessaging'] }

[build-dependencies]
slint-build = { version = '=1.19.0', default-features = false, features = [
  'compat-1-18',
], optional = true }
